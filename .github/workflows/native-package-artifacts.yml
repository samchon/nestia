name: native-package-artifacts
on:
  pull_request:
    paths:
      - '.github/workflows/native-package-artifacts.yml'
      - 'config/testing/compare-ttsc-package-artifacts.cjs'
      - 'packages/core/native/**'
      - 'packages/sdk/native/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: samchon/ttsc
          ref: e1ec1c6b5e38fc648c086d4ae8207fb01b48063a
          path: ttsc-upstream
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core/native/go.mod
          cache: false
      - uses: pnpm/action-setup@v4
      - name: Install Nestia dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned ttsc source dependencies
        working-directory: ttsc-upstream
        run: pnpm install --frozen-lockfile
      - name: Build pinned ttsc and Windows helper
        working-directory: ttsc-upstream
        run: |
          pnpm --filter ttsc build
          pnpm --filter @ttsc/win32-x64 build
      - name: Build Nestia package prerequisites
        run: pnpm build
      - name: Compare ordinary and package-artifact source builds
        env:
          TTSC_SOURCE_ROOT: ${{ github.workspace }}/ttsc-upstream
        run: node config/testing/compare-ttsc-package-artifacts.cjs
