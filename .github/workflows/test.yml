name: test
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TTSC_GO_BINARY: go
      TTSC_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/ttsc
      GOCACHE: ${{ github.workspace }}/node_modules/.cache/ttsc/go-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: packages/core/native/go.mod
          cache: false
      - uses: pnpm/action-setup@v4
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore ttsc Plugin Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/ttsc
            ~/go/pkg/mod
          key: ttsc-v2-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('pnpm-lock.yaml', 'packages/core/native/**', 'packages/sdk/native/**', 'packages/*/test/go.*') }}
          restore-keys: |
            ttsc-v2-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('pnpm-lock.yaml', 'packages/core/native/**', 'packages/sdk/native/**', 'packages/*/test/go.*') }}
            ttsc-v2-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
            ttsc-v2-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Run Tests
        run: pnpm test
