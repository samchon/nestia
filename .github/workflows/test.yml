name: test
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TTSC_GO_BINARY: go
      TTSC_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/ttsc
      GOCACHE: ${{ github.workspace }}/node_modules/.cache/ttsc/go-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: packages/core/native/go.mod
          cache: false
      - uses: pnpm/action-setup@v4
      - name: Install Dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Restore Test Cache
        id: test-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.cache/ttsc
            ~/go/pkg/mod
            packages/migrate/assets/.bundle-cache.json
            packages/migrate/src/bundles
          key: ttsc-v2-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('pnpm-lock.yaml', 'packages/core/native/**', 'packages/sdk/native/**', 'packages/*/test/go.*', 'packages/migrate/src/executable/*.js', 'package.json') }}
          restore-keys: |
            ttsc-v2-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      # A prior test cache includes native test hosts that a build cache lacks.
      # Resolve that population first; a prefix match is useful even when
      # cache-hit is false. Never overwrite it with an exact build-key match.
      - name: Restore Build Cache On Test Cache Miss
        if: steps.test-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.cache/ttsc
            ~/go/pkg/mod
            packages/migrate/assets/.bundle-cache.json
            packages/migrate/src/bundles
          key: ttsc-v2-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('pnpm-lock.yaml', 'packages/core/native/**', 'packages/sdk/native/**', 'packages/*/test/go.*', 'packages/migrate/src/executable/*.js', 'package.json') }}
          restore-keys: |
            ttsc-v2-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Build Packages
        id: build
        run: pnpm build
      - name: Evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm evidence
      - name: Go Units
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:go
      - name: JavaScript Units
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:unit
      - name: Runner Units After Build Failure
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.build.outcome == 'failure' }}
        run: pnpm exec node --test scripts/test_*.cjs
      - name: SDK And Migration Integrations
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:e2e
      - name: Save Test Cache
        if: success() && steps.test-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules/.cache/ttsc
            ~/go/pkg/mod
            packages/migrate/assets/.bundle-cache.json
            packages/migrate/src/bundles
          key: ${{ steps.test-cache.outputs.cache-primary-key }}
