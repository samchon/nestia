name: format
# Formatting has its own configuration and read-only check. All behavioral
# tests and implementation-contract checks belong to the single test.yml job.
on:
  pull_request:
    paths:
      - '.github/workflows/format.yml'
      - '.prettierignore'
      - 'prettier.config.js'
      # `.gitattributes` decides the line endings a checkout gets, and
      # Prettier's `endOfLine` compares against them, so it can turn this
      # check red on its own without any `*.ts` file changing.
      - '.gitattributes'
      - 'packages/**/*.ts'
      - 'tests/**/*.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install

      # One Prettier invocation over both globs. Chaining them would let an
      # unmatched pattern exit 2 and drop every target after it, which is how
      # `tests/**/*.ts` once went unformatted for the whole life of the script.
      - name: Check Formatting
        run: pnpm run format:check
