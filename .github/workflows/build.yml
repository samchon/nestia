name: build
on:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - 'config/**'
      # every file a package build reads: sources, bundler and TypeScript
      # configs, and the deploy scripts the build scripts run
      - 'packages/**'
      - 'deploy/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  # a build on master saves the ttsc plugin cache every pull request restores
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core/native/go.mod
          cache-dependency-path: packages/core/native/go.sum

      - name: Install Dependencies
        run: pnpm install

      # the job that saves the cache the test jobs restore
      - uses: ./.github/actions/ttsc-cache
        with:
          save: true

      - name: Use System Go For Source Plugin Build
        run: echo "TTSC_GO_BINARY=$(go env GOROOT)/bin/go" >> "$GITHUB_ENV"

      - name: Build Packages
        run: pnpm build

      # Compiles, without running, the Go test binaries into the cache's Go
      # object store, which test's go job restores: compiling them from cold is
      # nearly all of that job. Go keys each object by its inputs.
      - name: Compile Go Tests
        env:
          GOCACHE: ${{ github.workspace }}/node_modules/.cache/ttsc/go-build
        run: |
          (cd packages/core/test && go test -count=1 -run '^$' ./...)
          (cd packages/sdk/test && go test -count=1 -run '^$' ./...)
          (cd packages/core/native && go test -count=1 -run '^$' ./...)
