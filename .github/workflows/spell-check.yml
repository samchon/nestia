name: spell-check
on:
  pull_request:

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v4

      # a fixed release: @master changed the dictionary under every pull request
      - uses: crate-ci/typos@v1.50.2
        with:
          config: ./typos.toml
