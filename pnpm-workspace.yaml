packages:
  - 'benchmark'
  - 'config'
  - 'packages/*'
  - 'tests/*'

catalogs:
  nestjs:
    '@nestjs/common': &nestjs ^11.1.6
    '@nestjs/core': *nestjs
    '@nestjs/platform-express': *nestjs
    '@nestjs/platform-fastify': *nestjs
    '@nestjs/swagger': ^11.2.6
    reflect-metadata: ^0.2.2
    # the router NestJS 11 routes with, through Express 5
    path-to-regexp: ^8.4.2
    rxjs: ^7.1.0
  samchon:
    # Exact: the Go plugins link this release's transform, while the code it
    # emits calls the installed runtime (#1663).
    typia: 15.0.0
    '@typia/interface': &typia ^15.0.0
    '@typia/utils': *typia
    tgrid: ^1.2.1
    tstl: ^3.0.0
    '@wrtnlabs/evidence': 0.2.1
  utils:
    '@types/node': ^25.3.3
    '@types/uuid': ^11.0.0
    cross-env: ^10.1.0
    jsdom: ^22.0.0
    react: ^18.3.1
    react-test-renderer: ^18.3.1
    rimraf: ^6.1.3
    uuid: ^13.0.0
    multer: ^2.0.2
    fastify-multer: ^2.0.3
    '@types/express': ^4.17.21
    '@types/multer': ^1.4.12
    dotenv: ^16.3.1
    dotenv-expand: ^10.0.0
    express: ^4.21.1
    swagger-ui-express: ^5.0.1
    chalk: 4.1.2
    cli-progress: ^3.12.0
    serialize-error: ^4.1.0
    '@types/swagger-ui-express': ^4.1.8
    '@types/cli-progress': ^3.11.6
  typescript:
    '@babel/parser': ^7.29.8
    ttsc: &ttsc ^0.28.1
    '@ttsc/factory': *ttsc
    '@ttsc/unplugin': *ttsc
    '@trivago/prettier-plugin-sort-imports': ^4.3.0
    prettier: ^3.8.1
    prettier-plugin-jsdoc: ^1.8.0
    typescript: ^7.0.2
  modelcontextprotocol:
    '@modelcontextprotocol/sdk': ^1.18.0
  rolldown:
    rolldown: ^1.1.5
